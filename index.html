<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: radial-gradient(circle, #1a001a, #0d000d, #000000);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            color: #ff4d6d;
            text-shadow: 0 0 20px rgba(255, 77, 109, 0.8),
                         0 0 40px rgba(255, 77, 109, 0.5);
            animation: pulse 1.5s infinite alternate;
        }

        p {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #ffccd5;
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 20px rgba(255, 77, 109, 0.8); }
            100% { transform: scale(1.08); text-shadow: 0 0 30px rgba(255, 77, 109, 1), 0 0 60px rgba(255, 77, 109, 0.8); }
        }

        /* Hiệu ứng trái tim bay lên */
        .heart-float {
            position: absolute;
            bottom: -20px;
            color: rgba(255, 77, 109, 0.7);
            font-size: 20px;
            animation: floatUp 4s linear infinite;
            z-index: 1;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) scale(1.5);
                opacity: 0;
            }
        }

        /* Trái tim khi click chuột */
        .click-heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 24px;
            animation: flyAway 1s ease-out forwards;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes flyAway {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(1.8);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gửi Cậu ❤️</h1>
        <p>Chúc cậu một ngày ngập tràn niềm vui và yêu thương!</p>
    </div>

    <script>
        // Tự động sinh trái tim bay lên liên tục
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-float');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's'; // Từ 3 đến 6 giây
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 300);

        // Hiệu ứng click chuột tạo trái tim tỏa ra
        window.addEventListener('click', (e) => {
            for (let i = 0; i < 6; i++) {
                const heart = document.createElement('div');
                heart.classList.add('click-heart');
                heart.innerHTML = '💖';
                heart.style.left = e.clientX + 'px';
                heart.style.top = e.clientY + 'px';

                // Random hướng bay khi click
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 100 + 50;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                heart.style.setProperty('--dx', dx + 'px');
                heart.style.setProperty('--dy', dy + 'px');

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 1000);
            }
        });
    </script>
</body>
</html>
