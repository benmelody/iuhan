<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I love you in every universe ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at center, #1b002b 0%, #050009 100%);
            height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            cursor: crosshair;
        }

        .cosmic-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 41, 116, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(94, 232, 255, 0.1) 0%, transparent 50%);
            z-index: 1;
            pointer-events: none;
        }

        .message {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            width: 100%;
            padding: 0 20px;
            pointer-events: none;
        }

        h1 {
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            color: #ff758c;
            text-shadow: 0 0 15px rgba(255, 117, 140, 0.8);
            animation: fadeInMessage 2s ease-in-out forwards;
        }

        .subtitle {
            margin-top: 10px;
            font-size: clamp(0.9rem, 1.5vw, 1.2rem);
            color: #ffccd5;
            font-style: italic;
            opacity: 0;
            animation: fadeInMessage 2s ease-in-out 1s forwards;
        }

        .falling-text {
            position: absolute;
            color: #ffccd5;
            font-family: 'Pacifico', cursive;
            font-size: 1.1rem;
            text-shadow: 0 0 8px rgba(255, 117, 140, 0.6);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transition: opacity 1s ease-in-out;
        }

        /* Hiệu ứng trái tim bay từ dưới lên */
        .floating-heart {
            position: absolute;
            bottom: -20px;
            color: rgba(255, 105, 180, 0.6);
            font-size: 18px;
            animation: floatUpHeart linear infinite;
            z-index: 3;
            pointer-events: none;
        }

        @keyframes floatUpHeart {
            0% {
                transform: translateY(0) scale(0.6) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) scale(1.4) rotate(360deg);
                opacity: 0;
            }
        }

        /* Hiệu ứng pháo hoa trái tim khi click */
        .click-heart {
            position: absolute;
            color: #ff3366;
            font-size: 22px;
            animation: flyAway 1s ease-out forwards;
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 0 10px #ff3366;
        }

        @keyframes flyAway {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(1.8);
                opacity: 0;
            }
        }
